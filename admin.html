<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>siXeven - אדמין</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Rubik', sans-serif; }
        .spinner { border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; width: 14px; height: 14px; animation: spin .7s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        :focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

<!-- ============ כניסה ============ -->
<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-2xl">
        <div class="text-center">
            <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-indigo-600 flex items-center justify-center text-xl"><i class="fa-solid fa-shield-halved"></i></div>
            <h1 class="text-xl font-black">siXeven אדמין</h1>
            <p class="text-xs text-slate-500 mt-1">גישה לבעל האפליקציה בלבד</p>
        </div>
        <input id="admin-password" type="password" autocomplete="current-password" placeholder="סיסמת אדמין"
               onkeydown="if(event.key==='Enter')adminLogin()"
               class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500">
        <p id="login-error" class="text-rose-400 text-xs text-center min-h-4"></p>
        <button id="login-btn" onclick="adminLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm">כניסה</button>
    </div>
</div>

<!-- ============ האדמין ============ -->
<div id="admin-screen" class="hidden max-w-5xl mx-auto p-4 pb-16">
    <header class="flex items-center justify-between py-3">
        <h1 class="text-lg font-black"><i class="fa-solid fa-shield-halved text-indigo-400 ml-2"></i>siXeven אדמין</h1>
        <button onclick="adminLogout()" class="text-xs text-slate-400 hover:text-white border border-slate-800 rounded-lg px-3 py-1.5"><i class="fa-solid fa-arrow-right-from-bracket ml-1"></i>יציאה</button>
    </header>

    <nav class="flex gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800 text-sm mb-4">
        <button id="tab-overview" onclick="setTab('overview')" class="flex-1 py-2 rounded-lg font-bold">סקירה</button>
        <button id="tab-orders" onclick="setTab('orders')" class="flex-1 py-2 rounded-lg font-bold">הזמנות</button>
        <button id="tab-topups" onclick="setTab('topups')" class="flex-1 py-2 rounded-lg font-bold">טעינות</button>
        <button id="tab-cafeterias" onclick="setTab('cafeterias')" class="flex-1 py-2 rounded-lg font-bold">קפיטריות</button>
        <button id="tab-students" onclick="setTab('students')" class="flex-1 py-2 rounded-lg font-bold">תלמידים</button>
    </nav>

    <div id="period-bar" class="flex gap-1.5 mb-4 text-xs">
        <button data-period="today" onclick="setPeriod('today')" class="px-3 py-1.5 rounded-full border"></button>
        <button data-period="7d" onclick="setPeriod('7d')" class="px-3 py-1.5 rounded-full border"></button>
        <button data-period="30d" onclick="setPeriod('30d')" class="px-3 py-1.5 rounded-full border"></button>
        <button data-period="all" onclick="setPeriod('all')" class="px-3 py-1.5 rounded-full border"></button>
        <button onclick="refresh()" class="mr-auto px-3 py-1.5 rounded-full border border-slate-700 text-slate-300"><i class="fa-solid fa-rotate ml-1"></i>רענן</button>
    </div>

    <main id="content"></main>
</div>

<!-- חלון אישור -->
<div id="cf-modal" class="hidden fixed inset-0 z-40 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 shadow-2xl">
        <div class="flex items-center gap-3">
            <div id="cf-icon" class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"></div>
            <h3 id="cf-title" class="font-black text-base"></h3>
        </div>
        <p id="cf-text" class="text-sm text-slate-300 leading-relaxed"></p>
        <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="cfAnswer(false)" class="border border-slate-700 hover:bg-slate-800 text-slate-200 font-bold py-2.5 rounded-xl text-sm">ביטול</button>
            <button id="cf-ok" onclick="cfAnswer(true)" class="font-bold py-2.5 rounded-xl text-sm text-white"></button>
        </div>
    </div>
</div>

<!-- חלון הגדרת סיסמה -->
<div id="pw-modal" class="hidden fixed inset-0 z-40 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 shadow-2xl">
        <div class="flex items-start justify-between gap-3">
            <div>
                <h3 id="pw-title" class="font-black text-base"></h3>
                <p id="pw-sub" class="text-xs text-slate-400 mt-0.5"></p>
            </div>
            <button onclick="closePwModal()" aria-label="סגור" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="pw-warn" class="text-[11px] text-amber-300 bg-amber-950/40 border border-amber-700/40 rounded-lg p-2.5"></div>
        <div class="relative">
            <input id="pw-1" type="password" dir="ltr" autocomplete="new-password" placeholder="סיסמה חדשה" oninput="pwCheck()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 pl-10 text-sm text-left focus:outline-none focus:border-indigo-500">
            <button type="button" onclick="pwToggleShow()" aria-label="הצג או הסתר סיסמה" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300"><i id="pw-eye" class="fa-solid fa-eye"></i></button>
        </div>
        <input id="pw-2" type="password" dir="ltr" autocomplete="new-password" placeholder="הקלד שוב לאימות" oninput="pwCheck()" onkeydown="if(event.key==='Enter')pwSave()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-left focus:outline-none focus:border-indigo-500">
        <div class="flex items-center justify-between text-[11px]">
            <span id="pw-hint" class="text-slate-500"></span>
            <button type="button" onclick="pwGenerate()" class="text-indigo-300 hover:text-indigo-200 underline">צור סיסמה אקראית</button>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="closePwModal()" class="border border-slate-700 hover:bg-slate-800 text-slate-200 font-bold py-2.5 rounded-xl text-sm">ביטול</button>
            <button id="pw-save" onclick="pwSave()" disabled class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white font-bold py-2.5 rounded-xl text-sm">שמור סיסמה</button>
        </div>
    </div>
</div>

<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-xl text-sm font-bold shadow-xl"></div>

<script>
    const API = location.origin + '/api';
    const PERIOD_LABEL = { today: 'היום', '7d': '7 ימים', '30d': '30 יום', all: 'הכל' };
    const STATUS_LABEL = { pending: 'בהכנה', ready: 'מוכנה', cancelled: 'בוטלה' };
    const STATUS_CLS = {
        pending: 'bg-amber-950/60 text-amber-300 border-amber-600/40',
        ready: 'bg-emerald-950/60 text-emerald-300 border-emerald-600/40',
        cancelled: 'bg-slate-800 text-slate-400 border-slate-700'
    };

    let token = null;
    try { token = sessionStorage.getItem('sixeven_admin_token'); } catch (e) {}
    let tab = 'overview';
    let period = 'today';
    let ordersFilter = { cafeteriaId: '', status: '', payment: '' };
    let overview = null;

    const $ = (id) => document.getElementById(id);
    const esc = (v) => v == null ? '' : String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const money = (n) => '₪' + Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

    function toast(msg, error) {
        const t = $('toast');
        t.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-sm font-bold shadow-xl ' + (error ? 'bg-rose-600' : 'bg-emerald-600');
        t.textContent = msg;
        clearTimeout(toast.t);
        toast.t = setTimeout(() => t.classList.add('hidden'), 3000);
    }

    async function api(path, opts = {}) {
        const res = await fetch(API + path, {
            ...opts,
            headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }
        });
        let data = null;
        try { data = await res.json(); } catch (e) {}
        if (res.status === 401 && token) { adminLogout(); toast('פג תוקף ההתחברות, יש להיכנס שוב', true); throw new Error('expired'); }
        if (!res.ok) throw new Error((data && data.message) || ('שגיאה ' + res.status));
        return data;
    }

    const SERVER_MSG = {
        'Invalid login details': 'הסיסמה שגויה',
        'Admin is not configured': 'האדמין לא מוגדר בשרת (חסר ADMIN_PASSWORD_HASH)',
        'A cafeteria with this name already exists': 'כבר קיימת קפיטריה בשם הזה',
        'Cafeteria name is required (2+ characters)': 'נא להזין שם קפיטריה (לפחות 2 תווים)',
        'A valid email is required': 'נא להזין אימייל תקין',
        'Password must be at least 8 characters': 'הסיסמה חייבת להכיל לפחות 8 תווים'
    };
    const he = (m) => SERVER_MSG[m] || (/Too many/.test(m) ? 'יותר מדי ניסיונות. נסה שוב בעוד כמה דקות' : m);

    // ---------- כניסה / יציאה ----------
    async function adminLogin() {
        const btn = $('login-btn'), err = $('login-error');
        err.textContent = '';
        const password = $('admin-password').value;
        if (!password) { err.textContent = 'נא להזין סיסמה'; return; }
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
        try {
            const r = await api('/admin/login', { method: 'POST', body: JSON.stringify({ password }) });
            token = r.token;
            try { sessionStorage.setItem('sixeven_admin_token', token); } catch (e) {}
            $('admin-password').value = '';
            showAdmin();
        } catch (e) { err.textContent = he(e.message); }
        btn.disabled = false; btn.textContent = 'כניסה';
    }
    function adminLogout() {
        token = null;
        try { sessionStorage.removeItem('sixeven_admin_token'); } catch (e) {}
        $('admin-screen').classList.add('hidden');
        $('login-screen').classList.remove('hidden');
    }
    function showAdmin() {
        $('login-screen').classList.add('hidden');
        $('admin-screen').classList.remove('hidden');
        setTab('overview');
    }

    // ---------- ניווט ----------
    function setTab(t) {
        tab = t;
        for (const k of ['overview', 'orders', 'topups', 'cafeterias', 'students']) {
            $('tab-' + k).className = 'flex-1 py-2 rounded-lg font-bold ' + (k === t ? 'bg-indigo-600 text-white' : 'text-slate-400');
        }
        $('period-bar').classList.toggle('hidden', t === 'cafeterias' || t === 'students');
        paintPeriod();
        refresh();
    }
    function setPeriod(p) { period = p; paintPeriod(); refresh(); }
    function paintPeriod() {
        document.querySelectorAll('[data-period]').forEach(b => {
            const p = b.dataset.period;
            b.textContent = PERIOD_LABEL[p];
            b.className = 'px-3 py-1.5 rounded-full border ' + (p === period ? 'bg-indigo-600 border-indigo-500 text-white' : 'border-slate-700 text-slate-300');
        });
    }
    function loading() { $('content').innerHTML = '<div class="text-center py-16 text-slate-500"><span class="spinner"></span></div>'; }

    async function refresh() {
        loading();
        try {
            if (tab === 'overview') { overview = await api('/admin/overview?period=' + period); renderOverview(); }
            else if (tab === 'students') { await renderStudents(); }
            else if (tab === 'topups') { await renderTopups(); }
            else if (tab === 'cafeterias') { overview = await api('/admin/overview?period=all'); renderCafeterias(); }
            else { await renderOrders(); }
        } catch (e) {
            if (e.message !== 'expired') $('content').innerHTML = `<p class="text-center text-rose-400 text-sm py-10">${esc(e.message)}</p>`;
        }
    }

    // ---------- סקירה ----------
    function statCard(icon, label, value, cls) {
        return `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <p class="text-[11px] text-slate-500 mb-1"><i class="fa-solid ${icon} ml-1"></i>${label}</p>
            <p class="text-2xl font-black ${cls || 'text-white'}">${value}</p></div>`;
    }
    function renderOverview() {
        const t = overview.totals, list = overview.cafeterias;
        const maxRev = Math.max(1, ...list.map(c => c.revenue));
        $('content').innerHTML = `
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                ${statCard('fa-receipt', 'הזמנות', t.orders)}
                ${statCard('fa-sack-dollar', 'הכנסות', money(t.revenue), 'text-emerald-400')}
                ${statCard('fa-hourglass-half', 'ממתינות כעת', t.pending, 'text-amber-300')}
                ${statCard('fa-users', 'תלמידים רשומים', t.students)}
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-5">
                <p class="text-xs text-slate-400 font-bold mb-2">אמצעי תשלום (${PERIOD_LABEL[period]})</p>
                ${payBar(t.wallet_total, t.cash_total)}
            </div>
            <h2 class="text-sm font-bold mb-2">לפי קפיטריה</h2>
            <div class="space-y-3">${list.length === 0 ? '<p class="text-slate-500 text-sm text-center py-8">עדיין אין קפיטריות</p>' : list.map(c => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <span class="font-bold">${esc(c.name)}</span>
                            ${c.is_open ? '<span class="text-[11px] text-emerald-300 bg-emerald-950/60 border border-emerald-600/40 rounded-full px-2">פתוחה</span>' : '<span class="text-[11px] text-slate-400 bg-slate-800 border border-slate-700 rounded-full px-2">סגורה</span>'}
                        </div>
                        <span class="font-black text-emerald-400">${money(c.revenue)}</span>
                    </div>
                    <div class="h-2 bg-slate-800 rounded-full overflow-hidden mb-2"><div class="h-full bg-gradient-to-l from-indigo-500 to-emerald-500 rounded-full" style="width:${Math.round(c.revenue / maxRev * 100)}%"></div></div>
                    <div class="flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-slate-400">
                        <span>${c.orders} הזמנות</span><span>${c.pending} ממתינות</span><span>${c.cancelled} בוטלו</span>
                        <span>${c.students} תלמידים</span><span>ארנק ${money(c.wallet_total)}</span><span>מזומן ${money(c.cash_total)}</span>
                    </div>
                </div>`).join('')}</div>`;
    }
    function payBar(wallet, cash) {
        const total = wallet + cash;
        if (total <= 0) return '<p class="text-xs text-slate-500">אין נתונים בתקופה הזו</p>';
        const w = Math.round(wallet / total * 100);
        return `<div class="flex h-3 rounded-full overflow-hidden bg-slate-800"><div class="bg-sky-500" style="width:${w}%"></div><div class="bg-amber-400" style="width:${100 - w}%"></div></div>
            <div class="flex justify-between text-[11px] mt-2"><span class="text-sky-300"><i class="fa-solid fa-wallet ml-1"></i>ארנק ${money(wallet)} (${w}%)</span><span class="text-amber-300"><i class="fa-solid fa-money-bill-wave ml-1"></i>מזומן ${money(cash)} (${100 - w}%)</span></div>`;
    }

    // ---------- הזמנות ----------
    function sel(id, value, options) {
        return `<select id="${id}" onchange="onFilter()" class="bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-xs">${options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    }
    function onFilter() {
        ordersFilter = { cafeteriaId: $('f-caf').value, status: $('f-status').value, payment: $('f-pay').value };
        refresh();
    }
    async function renderOrders() {
        if (!overview) overview = await api('/admin/overview?period=all');
        const qs = new URLSearchParams({ period });
        for (const [k, v] of Object.entries(ordersFilter)) if (v) qs.set(k, v);
        const r = await api('/admin/orders?' + qs);
        const filters = `<div class="flex flex-wrap gap-2 mb-4">
            ${sel('f-caf', ordersFilter.cafeteriaId, [['', 'כל הקפיטריות'], ...overview.cafeterias.map(c => [c.id, c.name])])}
            ${sel('f-status', ordersFilter.status, [['', 'כל הסטטוסים'], ['pending', 'בהכנה'], ['ready', 'מוכנה'], ['cancelled', 'בוטלה']])}
            ${sel('f-pay', ordersFilter.payment, [['', 'כל אמצעי התשלום'], ['wallet', 'ארנק'], ['cash', 'מזומן']])}
            <span class="text-xs text-slate-500 self-center">${r.count} הזמנות${r.count >= 300 ? ' (מוצגות 300 אחרונות)' : ''}</span></div>`;
        const live = r.orders.filter(o => o.status !== 'cancelled');
        const sum = live.reduce((a, o) => a + Number(o.total_price), 0);
        $('content').innerHTML = filters + (r.orders.length === 0 ? '<p class="text-slate-500 text-sm text-center py-12">אין הזמנות לפי הסינון</p>' : `
            <p class="text-xs text-slate-400 mb-3">סה"כ (בלי מבוטלות): <b class="text-emerald-400">${money(sum)}</b></p>
            <div class="grid md:grid-cols-2 gap-3">${r.orders.map(o => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 ${o.status === 'cancelled' ? 'opacity-60' : ''}">
                    <div class="flex items-start justify-between mb-1">
                        <div><p class="font-bold text-sm">#${esc(o.id)} · ${esc(o.student_name)}</p>
                        <p class="text-[11px] text-slate-500"><span dir="ltr">${esc(o.student_phone)}</span> · ${new Date(o.created_at).toLocaleString('he-IL')}</p></div>
                        <span class="text-[11px] font-bold border rounded-full px-2 py-0.5 ${o.status === 'ready' && o.picked_up_at ? 'bg-sky-950/60 text-sky-300 border-sky-600/40' : (STATUS_CLS[o.status] || '')}">${o.status === 'ready' && o.picked_up_at ? 'נאספה' : (STATUS_LABEL[o.status] || esc(o.status))}</span>
                    </div>
                    <p class="text-[11px] text-indigo-300 mb-2"><i class="fa-solid fa-store ml-1"></i>${esc(o.cafeteria_name)}</p>
                    <ul class="text-xs text-slate-300 mb-2">${(o.items || []).map(i => `<li>${esc(i.product_name)} <span class="text-slate-500">x${i.quantity}</span>${i.item_notes ? ` <span class="text-amber-300/80">(${esc(i.item_notes)})</span>` : ''}</li>`).join('')}</ul>
                    ${o.notes ? `<p class="text-xs text-amber-300/90 mb-2"><i class="fa-solid fa-note-sticky ml-1"></i>${esc(o.notes)}</p>` : ''}
                    ${o.picked_up_at ? `<p class="text-[11px] text-sky-300 mb-2"><i class="fa-solid fa-bag-shopping ml-1"></i>נאספה ב-${new Date(o.picked_up_at).toLocaleString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>` : ''}
                    <div class="flex items-center justify-between">
                        <span class="font-black ${o.status === 'cancelled' ? 'text-slate-500 line-through' : 'text-emerald-400'}">${money(o.total_price)}</span>
                        ${o.payment_method === 'cash'
                            ? '<span class="text-[11px] font-bold text-amber-300 bg-amber-950/60 border border-amber-600/40 rounded-full px-2 py-0.5"><i class="fa-solid fa-money-bill-wave ml-1"></i>מזומן</span>'
                            : '<span class="text-[11px] font-bold text-sky-300 bg-sky-950/60 border border-sky-600/40 rounded-full px-2 py-0.5"><i class="fa-solid fa-wallet ml-1"></i>ארנק</span>'}
                    </div>
                </div>`).join('')}</div>`);
    }

    // ---------- קפיטריות ----------
    function renderCafeterias() {
        const list = overview.cafeterias;
        $('content').innerHTML = `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 mb-5">
                <h2 class="text-sm font-bold">קפיטריה חדשה</h2>
                <input id="nc-name" maxlength="100" placeholder="שם הקפיטריה (כך התלמידים בוחרים אותה בהרשמה)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
                <input id="nc-email" type="email" dir="ltr" maxlength="200" placeholder="אימייל המנהל (לכניסה)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-left focus:outline-none focus:border-indigo-500">
                <div class="flex gap-2">
                    <input id="nc-pass" type="text" dir="ltr" autocomplete="off" placeholder="סיסמה (8 תווים ומעלה)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-left focus:outline-none focus:border-indigo-500">
                    <button type="button" onclick="$('nc-pass').value = genPassword()" class="border border-slate-700 text-slate-300 text-xs font-bold px-3 rounded-xl">צור סיסמה</button>
                </div>
                <p class="text-[11px] text-slate-500">הסיסמה נשמרת מוצפנת ולא ניתן לראות אותה שוב. שמור אותה ומסור למנהל.</p>
                <p id="nc-msg" class="text-xs min-h-4 text-center"></p>
                <button id="nc-btn" onclick="createCafeteria()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm">צור קפיטריה</button>
            </div>
            <h2 class="text-sm font-bold mb-2">קפיטריות קיימות (${list.length})</h2>
            <div class="space-y-2">${list.map(c => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between gap-2">
                    <div class="min-w-0"><p class="font-bold text-sm truncate">${esc(c.name)} ${c.is_blocked ? '<span class="text-[11px] text-rose-300 bg-rose-950/60 border border-rose-700/40 rounded-full px-2 mr-1">חסומה</span>' : ''}</p>
                    <p class="text-[11px] text-slate-500 truncate" dir="ltr">${esc(c.email)}</p>
                    <p class="text-[11px] text-slate-500">${c.students} תלמידים</p></div>
                    <div class="shrink-0 flex flex-col gap-1.5">
                        <button onclick="resetPassword(${c.id})" class="text-xs border border-slate-700 text-slate-300 hover:bg-slate-800 rounded-lg px-3 py-1.5"><i class="fa-solid fa-key ml-1"></i>סיסמת כניסה</button>
                        <button onclick="toggleCafeteriaBlock(${c.id})" class="text-xs border ${c.is_blocked ? 'border-emerald-700 text-emerald-300' : 'border-rose-800 text-rose-300'} hover:bg-slate-800 rounded-lg px-3 py-1.5"><i class="fa-solid ${c.is_blocked ? 'fa-lock-open' : 'fa-ban'} ml-1"></i>${c.is_blocked ? 'שחרר קפיטריה' : 'חסום קפיטריה'}</button>
                        <button onclick="setTopupPassword(${c.id})" class="text-xs border ${c.has_topup_password ? 'border-emerald-700 text-emerald-300' : 'border-amber-700 text-amber-300'} hover:bg-slate-800 rounded-lg px-3 py-1.5"><i class="fa-solid fa-wallet ml-1"></i>${c.has_topup_password ? 'החלף סיסמת טעינה' : 'קבע סיסמת טעינה'}</button>
                    </div>
                </div>`).join('')}</div>`;
    }
    function genPassword() {
        const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';
        const a = new Uint32Array(12); crypto.getRandomValues(a);
        return Array.from(a, n => chars[n % chars.length]).join('');
    }
    async function createCafeteria() {
        const msg = $('nc-msg'), btn = $('nc-btn');
        msg.className = 'text-xs min-h-4 text-center text-rose-400'; msg.textContent = '';
        const body = { name: $('nc-name').value.trim(), email: $('nc-email').value.trim(), password: $('nc-pass').value };
        btn.disabled = true;
        try {
            const r = await api('/admin/cafeterias', { method: 'POST', body: JSON.stringify(body) });
            toast('הקפיטריה "' + r.cafeteria.name + '" נוצרה');
            refresh();
        } catch (e) { msg.textContent = he(e.message); btn.disabled = false; }
    }
    // ---------- טעינות ----------
    let topupsCafeteria = '';
    function onTopupsFilter() { topupsCafeteria = $('tp-caf').value; refresh(); }
    async function renderTopups() {
        if (!overview) overview = await api('/admin/overview?period=all');
        const qs = new URLSearchParams({ period });
        if (topupsCafeteria) qs.set('cafeteriaId', topupsCafeteria);
        const r = await api('/admin/topups?' + qs);
        const fmt = (d) => new Date(d).toLocaleString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        $('content').innerHTML = `
            <div class="flex flex-wrap gap-2 mb-4 items-center">
                <select id="tp-caf" onchange="onTopupsFilter()" class="bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-xs">
                    <option value="">כל הקפיטריות</option>
                    ${overview.cafeterias.map(c => `<option value="${c.id}" ${String(c.id) === String(topupsCafeteria) ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
                </select>
                <span class="text-xs text-slate-500">${r.count} טעינות${r.count > r.topups.length ? ' (מוצגות 300 אחרונות)' : ''}</span>
            </div>
            <div class="grid grid-cols-2 gap-3 mb-4">
                ${statCard('fa-wallet', 'סה"כ הוטען (' + PERIOD_LABEL[period] + ')', money(r.total), 'text-emerald-400')}
                ${statCard('fa-hashtag', 'מספר טעינות', r.count)}
            </div>
            ${r.topups.length === 0 ? '<p class="text-slate-500 text-sm text-center py-12">אין טעינות בתקופה הזו</p>' : `
            <div class="grid md:grid-cols-2 gap-2">${r.topups.map(t => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between gap-2 ${t.cancelled_at ? 'opacity-60' : ''}">
                    <div class="min-w-0">
                        <p class="font-bold text-sm truncate">${esc(t.student_name)}</p>
                        <p class="text-[11px] text-slate-500"><span dir="ltr">${esc(t.student_phone)}</span> · ${fmt(t.created_at)}</p>
                        <p class="text-[11px] text-indigo-300 truncate"><i class="fa-solid fa-store ml-1"></i>${esc(t.cafeteria_name)}</p>
                        ${t.cancelled_at ? `<p class="text-[11px] text-rose-300">בוטלה ב-${fmt(t.cancelled_at)}</p>` : ''}
                    </div>
                    <span class="font-black shrink-0 ${t.cancelled_at ? 'text-slate-500 line-through' : 'text-emerald-400'}">+${money(t.amount)}</span>
                </div>`).join('')}</div>`}`;
    }

    // ---------- חלון אישור ----------
    let cfResolve = null;
    function confirmModal({ title, text, okLabel, danger, icon }) {
        $('cf-title').textContent = title;
        $('cf-text').textContent = text;
        $('cf-ok').textContent = okLabel;
        $('cf-ok').className = 'font-bold py-2.5 rounded-xl text-sm text-white ' + (danger ? 'bg-rose-600 hover:bg-rose-500' : 'bg-emerald-600 hover:bg-emerald-500');
        $('cf-icon').className = 'w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ' + (danger ? 'bg-rose-950/60 text-rose-300' : 'bg-emerald-950/60 text-emerald-300');
        $('cf-icon').innerHTML = '<i class="fa-solid ' + (icon || (danger ? 'fa-ban' : 'fa-lock-open')) + '"></i>';
        $('cf-modal').classList.remove('hidden');
        return new Promise(r => { cfResolve = r; });
    }
    function cfAnswer(v) { $('cf-modal').classList.add('hidden'); if (cfResolve) cfResolve(v); cfResolve = null; }

    // ---------- חסימה ושחרור ----------
    async function toggleCafeteriaBlock(id) {
        const c = overview.cafeterias.find(x => x.id === id); if (!c) return;
        const block = !c.is_blocked;
        const ok = await confirmModal(block
            ? { title: 'לחסום את "' + c.name + '"?', text: 'מנהל הקפיטריה לא יוכל להיכנס, התלמידים שלה לא יוכלו להזמין, והיא לא תופיע ברשימת ההרשמה. אפשר לשחרר בכל עת.', okLabel: 'חסום קפיטריה', danger: true }
            : { title: 'לשחרר את "' + c.name + '"?', text: 'הקפיטריה תחזור לפעול כרגיל: המנהל יוכל להיכנס והתלמידים יוכלו להזמין.', okLabel: 'שחרר', danger: false });
        if (!ok) return;
        try {
            await api('/admin/cafeterias/' + id + '/blocked', { method: 'PUT', body: JSON.stringify({ blocked: block }) });
            toast(block ? 'הקפיטריה נחסמה' : 'הקפיטריה שוחררה');
            refresh();
        } catch (e) { toast(he(e.message), true); }
    }

    // ---------- תלמידים ----------
    let studentsQuery = '', studentsTimer = null, studentsCache = [];
    async function renderStudents() {
        const r = await api('/admin/students' + (studentsQuery ? '?q=' + encodeURIComponent(studentsQuery) : ''));
        studentsCache = r.students;
        $('content').innerHTML = `
            <input id="st-search" value="${esc(studentsQuery)}" oninput="onStudentSearch()" placeholder="חיפוש לפי שם, טלפון או קפיטריה" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm mb-3 focus:outline-none focus:border-indigo-500">
            <p class="text-xs text-slate-500 mb-3">${r.count} תלמידים${r.count >= 200 ? ' (מוצגים 200, צמצם עם חיפוש)' : ''}</p>
            <div class="grid md:grid-cols-2 gap-2">${r.students.length === 0 ? '<p class="text-slate-500 text-sm text-center py-10 md:col-span-2">לא נמצאו תלמידים</p>' : r.students.map(st => `
                <div class="bg-slate-900 border ${st.is_blocked ? 'border-rose-800/60' : 'border-slate-800'} rounded-xl p-3 flex items-center justify-between gap-2">
                    <div class="min-w-0">
                        <p class="font-bold text-sm truncate">${esc(st.name)} ${st.is_blocked ? '<span class="text-[11px] text-rose-300 bg-rose-950/60 border border-rose-700/40 rounded-full px-2 mr-1">חסום</span>' : ''}</p>
                        <p class="text-[11px] text-slate-500" dir="ltr" style="text-align:right">${esc(st.phone)}</p>
                        <p class="text-[11px] text-indigo-300 truncate"><i class="fa-solid fa-store ml-1"></i>${esc(st.cafeteria_name)} · יתרה ${money(st.balance)}</p>
                    </div>
                    <div class="shrink-0 flex flex-col gap-1.5">
                        <button onclick="toggleStudentBlock(${st.id})" class="text-xs border ${st.is_blocked ? 'border-emerald-700 text-emerald-300' : 'border-rose-800 text-rose-300'} hover:bg-slate-800 rounded-lg px-3 py-1.5">${st.is_blocked ? 'שחרר' : 'חסום'}</button>
                        <button onclick="deleteStudent(${st.id})" class="text-xs border border-slate-700 text-slate-400 hover:text-rose-300 hover:border-rose-800 hover:bg-slate-800 rounded-lg px-3 py-1.5"><i class="fa-solid fa-trash ml-1"></i>מחק</button>
                    </div>
                </div>`).join('')}</div>`;
        const el = $('st-search'); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    }
    async function deleteStudent(id) {
        const st = studentsCache.find(x => x.id === id); if (!st) return;
        const hasBalance = st.balance > 0;
        const ok = await confirmModal({
            title: 'למחוק את ' + st.name + '?',
            text: 'הפרטים האישיים של התלמיד (שם וטלפון) יימחקו והוא לא יוכל להיכנס יותר. הזמנות קודמות נשארות בדוחות של הקפיטריה בלי שם.'
                + (hasBalance ? ' שים לב: בארנק שלו יתרה של ' + money(st.balance) + ', והיא תימחק. ודא שהקפיטריה החזירה לו את הכסף.' : '')
                + ' אי אפשר לשחזר.',
            okLabel: 'מחק תלמיד', danger: true, icon: 'fa-trash'
        });
        if (!ok) return;
        try {
            await api('/admin/students/' + id, { method: 'DELETE', body: JSON.stringify({ force: hasBalance }) });
            toast('התלמיד נמחק');
            refresh();
        } catch (e) { toast(he(e.message), true); }
    }
    function onStudentSearch() {
        clearTimeout(studentsTimer);
        studentsQuery = $('st-search').value.trim();
        studentsTimer = setTimeout(() => refresh(), 350);
    }
    async function toggleStudentBlock(id) {
        const st = studentsCache.find(x => x.id === id); if (!st) return;
        const block = !st.is_blocked;
        const ok = await confirmModal(block
            ? { title: 'לחסום את ' + st.name + '?', text: 'התלמיד יתנתק ולא יוכל להיכנס או להזמין. היתרה בארנק נשמרת. אפשר לשחרר בכל עת.', okLabel: 'חסום תלמיד', danger: true }
            : { title: 'לשחרר את ' + st.name + '?', text: 'התלמיד יוכל להיכנס ולהזמין שוב.', okLabel: 'שחרר', danger: false });
        if (!ok) return;
        try {
            await api('/admin/students/' + id + '/blocked', { method: 'PUT', body: JSON.stringify({ blocked: block }) });
            toast(block ? 'התלמיד נחסם' : 'התלמיד שוחרר');
            refresh();
        } catch (e) { toast(he(e.message), true); }
    }

    // ---------- חלון הגדרת סיסמה (במקום חלוני הדפדפן) ----------
    let pwCfg = null;
    function openPwModal(cfg) {
        pwCfg = cfg;
        $('pw-title').textContent = cfg.title;
        $('pw-sub').textContent = cfg.sub;
        $('pw-warn').innerHTML = cfg.warn;
        $('pw-1').value = ''; $('pw-2').value = '';
        $('pw-1').type = 'password'; $('pw-2').type = 'password';
        $('pw-eye').className = 'fa-solid fa-eye';
        $('pw-modal').classList.remove('hidden');
        pwCheck();
        setTimeout(() => $('pw-1').focus(), 50);
    }
    function closePwModal() { $('pw-modal').classList.add('hidden'); pwCfg = null; $('pw-1').value = ''; $('pw-2').value = ''; }
    function pwToggleShow() {
        const show = $('pw-1').type === 'password';
        $('pw-1').type = show ? 'text' : 'password';
        $('pw-2').type = show ? 'text' : 'password';
        $('pw-eye').className = 'fa-solid ' + (show ? 'fa-eye-slash' : 'fa-eye');
    }
    function pwGenerate() {
        const p = genPassword();
        $('pw-1').value = p; $('pw-2').value = p;
        $('pw-1').type = 'text'; $('pw-2').type = 'text';
        $('pw-eye').className = 'fa-solid fa-eye-slash';
        pwCheck();
    }
    function pwCheck() {
        if (!pwCfg) return;
        const a = $('pw-1').value, b = $('pw-2').value;
        const hint = $('pw-hint'), btn = $('pw-save');
        let ok = false;
        if (a.length === 0) { hint.className = 'text-slate-500'; hint.textContent = 'לפחות ' + pwCfg.min + ' תווים'; }
        else if (a.length < pwCfg.min) { hint.className = 'text-slate-500'; hint.textContent = 'עוד ' + (pwCfg.min - a.length) + ' תווים'; }
        else if (b.length === 0) { hint.className = 'text-slate-500'; hint.textContent = 'הקלד שוב לאימות'; }
        else if (a !== b) { hint.className = 'text-rose-400'; hint.textContent = 'הסיסמאות לא זהות'; }
        else { hint.className = 'text-emerald-400'; hint.textContent = 'מוכן לשמירה'; ok = true; }
        btn.disabled = !ok;
    }
    async function pwSave() {
        if (!pwCfg || $('pw-save').disabled) return;
        const btn = $('pw-save'), cfg = pwCfg, pw = $('pw-1').value;
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
        try {
            await api(cfg.path, { method: 'PUT', body: JSON.stringify({ password: pw }) });
            closePwModal();
            toast(cfg.success);
            if (cfg.after) cfg.after();
        } catch (e) {
            $('pw-hint').className = 'text-rose-400'; $('pw-hint').textContent = he(e.message);
        }
        btn.textContent = 'שמור סיסמה'; pwCheck();
    }
    function cafName(id) { const c = overview.cafeterias.find(x => x.id === id); return c ? c.name : ''; }
    function resetPassword(id) {
        const name = cafName(id);
        openPwModal({
            title: 'סיסמת כניסה למנהל הקפיטריה', sub: name, min: 8,
            warn: '<i class="fa-solid fa-triangle-exclamation ml-1"></i>הסיסמה הנוכחית של המנהל תפסיק לעבוד מיד. מסור את הסיסמה החדשה לבעלים של הקפיטריה.',
            path: '/admin/cafeterias/' + id + '/password',
            success: 'סיסמת הכניסה של "' + name + '" עודכנה'
        });
    }
    function setTopupPassword(id) {
        const name = cafName(id);
        openPwModal({
            title: 'סיסמת טעינת ארנק', sub: name, min: 6,
            warn: '<i class="fa-solid fa-circle-info ml-1"></i>הסיסמה הזו נדרשת בכל טעינת ארנק. מסור אותה רק לבעלים של הקפיטריה.',
            path: '/admin/cafeterias/' + id + '/topup-password',
            success: 'סיסמת הטעינה של "' + name + '" נקבעה',
            after: refresh
        });
    }

    if (token) showAdmin();
</script>
</body>
</html>
